name: Staging Security E2E

on:
  workflow_dispatch:
    inputs:
      confirm_staging_mutations:
        description: "Exercise bounded mutations against Wilmet staging fixtures"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  security-e2e:
    name: Real-JWT Lovable-managed staging verification
    if: ${{ inputs.confirm_staging_mutations }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_ALLOW_STAGING_MUTATIONS: "true"
      E2E_TARGET_LABEL: "wilmet-staging"
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_MANAGED_CONFIG_JSON: ${{ secrets.E2E_MANAGED_CONFIG_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify required managed-staging configuration is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${E2E_SUPABASE_URL}" || { echo "Missing E2E_SUPABASE_URL"; exit 1; }
          test -n "${E2E_SUPABASE_ANON_KEY}" || { echo "Missing E2E_SUPABASE_ANON_KEY"; exit 1; }
          test -n "${E2E_MANAGED_CONFIG_JSON}" || { echo "Missing E2E_MANAGED_CONFIG_JSON"; exit 1; }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Lovable-managed real-JWT staging security suite
        run: bun test ./tests/staging/managed-security.staging.ts --timeout 60000

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-security-e2e-${{ github.run_id }}
          path: test-results/*.json
          if-no-files-found: warn
          retention-days: 30
