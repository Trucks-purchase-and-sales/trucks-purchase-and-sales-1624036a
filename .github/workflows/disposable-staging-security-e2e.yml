name: Disposable Staging Security E2E

on:
  workflow_dispatch:
    inputs:
      confirm_staging_mutations:
        description: "Exercise bounded mutations against the disposable staging Supabase project (Salma's personal project, no real Wilmet data)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  security-e2e:
    name: Service-role real-JWT disposable staging verification
    if: ${{ inputs.confirm_staging_mutations }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Targets Salma's personal, disposable Supabase project (see
    # docs/v2p/decisions/ADR-005) -- never Lovable's managed backend. See
    # docs/security/staging-security-e2e.md for why this direct-owned
    # variant exists alongside the managed-provider suite in
    # staging-security-e2e.yml.
    env:
      E2E_ALLOW_STAGING_MUTATIONS: "true"
      E2E_TARGET_LABEL: "wilmet-staging"
      E2E_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify required disposable-staging configuration is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${E2E_SUPABASE_URL}" || { echo "Missing E2E_DISPOSABLE_SUPABASE_URL secret"; exit 1; }
          test -n "${E2E_SUPABASE_ANON_KEY}" || { echo "Missing E2E_DISPOSABLE_SUPABASE_ANON_KEY secret"; exit 1; }
          test -n "${E2E_SUPABASE_SERVICE_ROLE_KEY}" || { echo "Missing E2E_DISPOSABLE_SUPABASE_SERVICE_ROLE_KEY secret"; exit 1; }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run disposable-staging service-role security suite
        run: bun test tests/staging/security.staging.ts --timeout 200000

      # Three suites added 2026-08-27 -- written earlier but never wired
      # into any workflow (confirmed via a full grep of .github/workflows/
      # before adding them here). Same env-var contract as the suite
      # above, same disposable project, no new secrets needed.
      - name: Run TM-011 workflow-children real-JWT suite (F-013)
        run: bun test tests/staging/workflow-children.staging.ts --timeout 200000

      - name: Run TM-011 photo-handoff real-JWT suite (F-016)
        run: bun test tests/staging/photo-handoff.staging.ts --timeout 200000

      - name: Run workflow-transaction atomicity suite (F-022)
        run: bun test tests/staging/workflow-transactions.staging.ts --timeout 200000

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-staging-security-e2e-${{ github.run_id }}
          path: test-results/*.json
          if-no-files-found: warn
          retention-days: 30
