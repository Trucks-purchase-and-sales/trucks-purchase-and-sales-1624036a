name: PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository full history for secrets
        run: gitleaks git --redact --verbose --log-opts="--all" .

  build:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" |
              grep -E '\.(ts|tsx)$' || true
          )

          if ((${#changed_files[@]} == 0)); then
            echo "No changed TypeScript files."
            exit 0
          fi

          printf 'Linting changed file: %s\n' "${changed_files[@]}"
          bunx eslint --max-warnings 0 "${changed_files[@]}"

      - name: Unit tests
        run: bun test

      - name: Compile staging security harnesses
        run: bun build tests/staging/*.staging.ts --target=bun --outdir=/tmp/wilmet-staging-e2e-check

      - name: Set up Node 22 for browser-test tooling
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Runs against Salma's personal, disposable Supabase project (see
      # docs/v2p/decisions/ADR-005) -- never Lovable's managed backend --
      # so a real browser session can exercise real login/role-restriction
      # behavior on every PR with no risk to actual Wilmet data.
      - name: Run Playwright E2E suite against a live dev server
        working-directory: e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_TARGET_LABEL: local
          E2E_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

          (cd .. && bun run dev -- --port 4173 --host 127.0.0.1) &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT

          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "dev server did not become ready in time"
            exit 1
          fi

          npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Set up pinned k6 2.1.0
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: "2.1.0"

      - name: Validate k6 execution requirements without traffic
        env:
          K6_BASE_URL: http://127.0.0.1:4173
          K6_TARGET_LABEL: local
        run: k6 inspect --include-system-env-vars --execution-requirements performance/public-read-smoke.js

      - name: Build
        run: bun run build
