name: PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" |
              grep -E '\.(ts|tsx)$' || true
          )

          if ((${#changed_files[@]} == 0)); then
            echo "No changed TypeScript files."
            exit 0
          fi

          printf 'Linting changed file: %s\n' "${changed_files[@]}"
          bunx eslint --max-warnings 0 "${changed_files[@]}"

      - name: Unit tests
        run: bun test

      - name: Compile staging security harnesses
        run: bun build tests/staging/*.staging.ts --target=bun --outdir=/tmp/wilmet-staging-e2e-check

      - name: Set up Node 22 for browser-test tooling
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Validate pinned Playwright harness
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_TARGET_LABEL: local
        run: |
          npm ci
          npm run test:list

      - name: Set up pinned k6 2.1.0
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: "2.1.0"

      - name: Validate k6 execution requirements without traffic
        env:
          K6_BASE_URL: http://127.0.0.1:4173
          K6_TARGET_LABEL: local
        run: k6 inspect --include-system-env-vars --execution-requirements performance/public-read-smoke.js

      - name: Build
        run: bun run build
