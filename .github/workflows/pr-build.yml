name: PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository full history for secrets
        run: gitleaks git --redact --verbose --log-opts="--all" .

  build:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocking: verified clean (zero errors) against the current codebase
      # before wiring this in, so unlike the checks below it's safe to gate
      # merges on from day one rather than starting as a warning-only step.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint changed TypeScript files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" |
              grep -E '\.(ts|tsx)$' || true
          )

          if ((${#changed_files[@]} == 0)); then
            echo "No changed TypeScript files."
            exit 0
          fi

          printf 'Linting changed file: %s\n' "${changed_files[@]}"
          bunx eslint --max-warnings 0 "${changed_files[@]}"

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Not version-pinned, matching how this was first run manually in
      # Phase 3 (apps/wilmet/evidence/phase3-dependency-static-checks.txt) --
      # unlike gitleaks/k6/bun above, this only scans source text rather than
      # executing with elevated trust, so the lower supply-chain risk doesn't
      # justify guessing at a pinned version with no way to verify it exists.
      #
      # Warning-only for now: that Phase 3 run found 10 findings, all the
      # same dismissed false positive, but never against this exact ruleset
      # (p/typescript p/react p/owasp-top-ten) or the full current codebase.
      # Let the first real run establish the baseline before deciding
      # whether to make this blocking.
      - name: Static analysis (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config p/typescript --config p/react --config p/owasp-top-ten \
            --metrics=off || echo "::warning::Semgrep findings -- see log above"

      # Warning-only: Phase 3's manual npm audit found one accepted-risk
      # high-severity finding with no fix available (xlsx -- see the same
      # evidence file), which would otherwise fail every single PR forever.
      - name: Dependency audit
        run: bun audit || echo "::warning::bun audit findings -- see log above"

      - name: Unit tests
        run: bun test

      - name: Compile staging security harnesses
        run: bun build tests/staging/*.staging.ts --target=bun --outdir=/tmp/wilmet-staging-e2e-check

      - name: Set up Node 22 for browser-test tooling
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Runs against Salma's personal, disposable Supabase project (see
      # docs/v2p/decisions/ADR-005) -- never Lovable's managed backend --
      # so a real browser session can exercise real login/role-restriction
      # behavior on every PR with no risk to actual Wilmet data.
      - name: Run Playwright E2E suite against a live dev server
        working-directory: e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          # The app's own admin client (src/integrations/supabase/client.server.ts)
          # needs this for server-only features -- rate limiting, in particular,
          # gates /api/public/buyer-leads, which tests/smoke/buyer-request.pw.ts
          # now exercises as part of this same suite. Without it that endpoint
          # 500s instead of returning JSON. Same disposable project as above.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_TARGET_LABEL: local
          E2E_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

          (cd .. && bun run dev -- --port 4173 --host 127.0.0.1) > /tmp/dev-server.log 2>&1 &
          DEV_PID=$!

          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "dev server did not become ready in time"
            cat /tmp/dev-server.log || true
            kill "$DEV_PID" 2>/dev/null || true
            exit 1
          fi

          # Capture the real exit code explicitly: bun's own child-process
          # supervisor prints a loud "error: script dev exited with code
          # 143" line (and non-zero-ish job status) once the dev server
          # below is killed for cleanup, which otherwise clobbers this
          # step's exit code even when every test passed.
          set +e
          npm test
          TEST_EXIT=$?
          set -e

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "----- dev server log -----"
            cat /tmp/dev-server.log || true
          fi

          kill "$DEV_PID" 2>/dev/null || true
          wait "$DEV_PID" 2>/dev/null || true
          exit "$TEST_EXIT"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Set up pinned k6 2.1.0
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: "2.1.0"

      - name: Validate k6 execution requirements without traffic
        env:
          K6_BASE_URL: http://127.0.0.1:4173
          K6_TARGET_LABEL: local
        run: k6 inspect --include-system-env-vars --execution-requirements performance/public-read-smoke.js

      - name: Build
        run: bun run build
