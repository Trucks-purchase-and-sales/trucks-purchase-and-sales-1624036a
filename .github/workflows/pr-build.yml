name: PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-functional-stabilization:
    name: Format functional stabilization branch
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/functional-stabilization-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve exposed icon type debt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          text = path.read_text()
          if "type LucideIcon" not in text:
              marker = '  Layers, Globe2,\n} from "lucide-react";'
              if marker not in text:
                  raise SystemExit("Could not locate lucide-react import marker")
              text = text.replace(
                  marker,
                  '  Layers, Globe2,\n  type LucideIcon,\n} from "lucide-react";',
                  1,
              )
          target = "items: { icon: any; title: string; text: string; n: number }[]"
          if target in text:
              text = text.replace(
                  target,
                  "items: { icon: LucideIcon; title: string; text: string; n: number }[]",
                  1,
              )
          path.write_text(text)
          PY

      - name: Format only stabilization files
        run: |
          bunx prettier --write \
            e2e/tests/public-smoke.pw.ts \
            src/components/public/PublicAccountActions.tsx \
            src/components/public/PublicShell.tsx \
            src/routes/auth.tsx \
            src/routes/index.tsx

      - name: Restore canonical CI workflow and push formatting commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.github/workflows/pr-build.yml" > .github/workflows/pr-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/pr-build.yml \
            e2e/tests/public-smoke.pw.ts \
            src/components/public/PublicAccountActions.tsx \
            src/components/public/PublicShell.tsx \
            src/routes/auth.tsx \
            src/routes/index.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: format functional stabilization changes"
          git push origin HEAD:"$HEAD_REF"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository full history for secrets
        run: gitleaks git --redact --verbose --log-opts="--all" .

  build:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" |
              grep -E '\.(ts|tsx)$' || true
          )

          if ((${#changed_files[@]} == 0)); then
            echo "No changed TypeScript files."
            exit 0
          fi

          printf 'Linting changed file: %s\n' "${changed_files[@]}"
          bunx eslint --max-warnings 0 "${changed_files[@]}"

      - name: Unit tests
        run: bun test

      - name: Compile staging security harnesses
        run: bun build tests/staging/*.staging.ts --target=bun --outdir=/tmp/wilmet-staging-e2e-check

      - name: Set up Node 22 for browser-test tooling
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Validate pinned Playwright harness
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_TARGET_LABEL: local
        run: |
          npm ci
          npm run test:list

      - name: Set up pinned k6 2.1.0
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: "2.1.0"

      - name: Validate k6 execution requirements without traffic
        env:
          K6_BASE_URL: http://127.0.0.1:4173
          K6_TARGET_LABEL: local
        run: k6 inspect --include-system-env-vars --execution-requirements performance/public-read-smoke.js

      - name: Build
        run: bun run build
