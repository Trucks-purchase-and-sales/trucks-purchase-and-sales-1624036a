name: k6 Disposable Load Test

# Phase 5 (EXECUTION-PLAN.md section 12), real traffic this time -- not the
# no-traffic `k6 inspect` step already in pr-build.yml.
#
# Deliberately does NOT target the "wilmet-staging" label the other manual
# k6/Playwright workflows use (those hit a hosted staging URL; Wilmet has
# none -- the only hosted deployment is Lovable's, which is production-
# backed). Targets "local" instead: a dev server started inside this job,
# bound to Salma's disposable Supabase project via the same secrets
# pr-build.yml already uses for Playwright. That satisfies Phase 5's
# "database-backed target" requirement without ever touching the real app
# or its data, and without depending on Lovable being healthy. Note the
# reusable pipeline/load/k6-*.js scripts themselves only know "local" or
# "staging" (generic, per pipeline/README.md) -- "wilmet-staging" is this
# repo's own instance-specific label used by a different, non-pipeline
# script family (performance/public-read-smoke.js and friends), unrelated
# to the scripts this workflow calls.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which k6 script(s) to run"
        required: true
        type: choice
        options:
          - baseline-only
          - baseline-then-ramp
        default: baseline-then-ramp

permissions:
  contents: read

jobs:
  load-test:
    name: Run k6 against a disposable-project-backed dev server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up pinned k6 2.1.0
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: "2.1.0"

      # Same disposable project as pr-build.yml's Playwright step (see
      # docs/v2p/decisions/ADR-005) -- never Lovable's managed backend.
      - name: Start dev server against the disposable Supabase project
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          bun run dev -- --port 4173 --host 127.0.0.1 > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid

          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "dev server did not become ready in time"
            cat /tmp/dev-server.log || true
            kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true
            exit 1
          fi

      - name: Prepare evidence directory
        run: mkdir -p test-results/k6

      - name: Run baseline (5 VUs, 2 minutes)
        env:
          K6_BASE_URL: http://127.0.0.1:4173
          K6_TARGET_LABEL: local
          K6_APP_NAME: wilmet
          K6_ROUTES_JSON: '[{"path":"/","name":"public-shell"},{"path":"/chercher-un-vehicule/","name":"buyer-request-entry"}]'
        run: |
          set +e
          k6 run \
            --out json=test-results/k6/baseline-raw.json \
            pipeline/load/k6-baseline.js \
            2>&1 | tee test-results/k6/baseline-summary.txt
          echo "BASELINE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e

      - name: Run ramp test (baseline -> peak -> 3x peak -> ramp down)
        if: ${{ inputs.profile == 'baseline-then-ramp' }}
        env:
          K6_BASE_URL: http://127.0.0.1:4173
          K6_TARGET_LABEL: local
          K6_APP_NAME: wilmet
          K6_ROUTES_JSON: '[{"path":"/","name":"public-shell"},{"path":"/chercher-un-vehicule/","name":"buyer-request-entry"}]'
        run: |
          set +e
          k6 run \
            --out json=test-results/k6/ramp-raw.json \
            pipeline/load/k6-load.js \
            2>&1 | tee test-results/k6/ramp-summary.txt
          echo "RAMP_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e

      - name: Stop dev server
        if: always()
        run: |
          cat /tmp/dev-server.log || true
          kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true

      # Decoupled from the app/dev-server entirely: hits PostgREST directly
      # with the same filter/order clauses reference-data.functions.ts uses,
      # so a real index gap would show up here even on routes where the app
      # layer never reaches the database under a plain HTTP client (see
      # pipeline/load/k6-db-read.js's own header comment for why this exists).
      - name: Run direct database-read check
        env:
          K6_SUPABASE_URL: ${{ secrets.E2E_DISPOSABLE_SUPABASE_URL }}
          K6_SUPABASE_ANON_KEY: ${{ secrets.E2E_DISPOSABLE_SUPABASE_ANON_KEY }}
          K6_DB_TARGET_LABEL: disposable
          K6_DB_PROBES_JSON: '[{"name":"ref-vehicle-categories","path":"/rest/v1/ref_vehicle_categories?select=slug,label_fr,label_en,sort_order&is_active=eq.true&order=sort_order"},{"name":"ref-vehicle-types","path":"/rest/v1/ref_vehicle_types?select=slug,label_fr,label_en,sort_order&is_active=eq.true&order=sort_order"},{"name":"ref-vehicle-brands","path":"/rest/v1/ref_vehicle_brands?select=slug,label,sort_order&is_active=eq.true&order=sort_order"},{"name":"ref-vehicle-models","path":"/rest/v1/ref_vehicle_models?select=id,brand_slug,label&is_active=eq.true&order=label"}]'
        run: |
          set +e
          k6 run \
            --out json=test-results/k6/db-read-raw.json \
            pipeline/load/k6-db-read.js \
            2>&1 | tee test-results/k6/db-read-summary.txt
          echo "DBREAD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e

      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-disposable-${{ github.run_id }}
          path: test-results/k6/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the job if any k6 run failed its thresholds
        run: |
          set -euo pipefail
          if [ "${BASELINE_EXIT:-1}" -ne 0 ]; then
            echo "::error::baseline k6 run failed (exit ${BASELINE_EXIT:-unset})"
            exit 1
          fi
          if [ "${{ inputs.profile }}" = "baseline-then-ramp" ] && [ "${RAMP_EXIT:-1}" -ne 0 ]; then
            echo "::error::ramp k6 run failed (exit ${RAMP_EXIT:-unset})"
            exit 1
          fi
          if [ "${DBREAD_EXIT:-1}" -ne 0 ]; then
            echo "::error::direct DB-read k6 run failed (exit ${DBREAD_EXIT:-unset})"
            exit 1
          fi
